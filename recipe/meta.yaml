{% set name = "briefcase" %}
{% set version = "0.4.7" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/briefcase-{{ version }}.tar.gz
  sha256: a9ea1c5e7603eba82c22a51694077a6b96e3335756dee61a994ad64e091372c3

build:
  noarch: python
  entry_points:
    - briefcase = briefcase.__main__:main
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools ==84.0.0
    - setuptools-scm ==10.3.4
    - pip
  run:
    - python >={{ python_min }}
    - packaging >=24.2
    - pip >=24.3
    - setuptools >=60
    - wheel >=0.37
    - xbuild >=0.4.0
    - cookiecutter >=2.6.0,<3.0
    - chardet <8.0
    - dmgbuild >=1.6.4,<2.0  # [osx]
    - gitpython >=3.1,<4.0
    - platformdirs >=2.6,<5.0
    - psutil >=5.9,<8.0
    - python-dateutil >=2.9.0.post0
    - httpx2 >=2.13,<3.0
    - rich >=12.6,<16.0
    - tenacity >=9.2.0,<10.0
    - tomli-w >=1.0,<2.0
    - typing_extensions >=4.6
    - __unix  # [unix]
    - __win   # [win]
    - __osx   # [osx]

test:
  imports:
    - briefcase
  commands:
    - pip check
    - briefcase --version
  requires:
    - python {{ python_min }}
    - pip

about:
  summary: Tools to support converting a Python project into a standalone native application.
  home: https://briefcase.beeware.org/
  dev_url: https://github.com/beeware/briefcase
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - freakboy3742
